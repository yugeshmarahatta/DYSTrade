<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DYS Trade | Product manager</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="assets/dys-logo.png" alt="DYS Trade logo"><span>DYS <strong>Trade</strong></span></a><a class="text-link" href="index.html">View public site <span aria-hidden="true">↗</span></a></div></header>
  <main class="admin-main container">
    <section class="admin-intro"><p class="eyebrow"><span></span> Private area</p><h1>Product<br><em>manager.</em></h1><p>Add and update the products shown on your public catalog.</p></section>
    <section class="admin-panel" id="login-panel"><h2>Sign in</h2><p class="admin-muted">Use the admin email and password created in Supabase.</p><form id="login-form"><label>Email<input id="login-email" type="email" required autocomplete="email"></label><label>Password<input id="login-password" type="password" required autocomplete="current-password"></label><button class="button button-dark" type="submit">Sign in <span aria-hidden="true">↗</span></button><p class="form-message" id="login-message" role="alert"></p></form></section>
    <section class="admin-panel" id="dashboard" hidden><div class="dashboard-head"><div><h2>Your catalog</h2><p class="admin-muted">Changes publish directly to the public site.</p></div><button class="button button-outline" id="sign-out" type="button">Sign out</button></div><form id="product-form" class="product-form"><input id="product-id" type="hidden"><input id="product-image-url" type="hidden"><label>Product name<input id="product-name" required></label><label>Category<select id="product-category"><option>Plastics</option><option>Cosmetics</option><option>Household</option><option>Other</option></select></label><label>Description<textarea id="product-description" rows="3" required></textarea></label><label>Product image<input id="product-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><small>JPG, PNG, WebP, or GIF. Maximum 5 MB.</small></label><div id="image-preview" class="image-preview" hidden></div><div class="field-row"><label>Price (NPR)<input id="product-price" type="number" min="0" step="0.01" placeholder="Leave blank to show on request"></label><label>Quantity<input id="product-quantity" type="number" min="0" step="0.01" placeholder="e.g. 24"></label></div><label>Quantity unit<input id="product-quantity-unit" value="piece" placeholder="piece, dozen, carton, kg"></label><label>Icon or emoji<input id="product-icon" value="▣" maxlength="4"></label><label>Availability label<input id="product-unit" value="Wholesale & retail" required></label><label class="check-label"><input id="product-active" type="checkbox" checked> Show on public site</label><div class="form-actions"><button class="button button-dark" type="submit">Save product <span aria-hidden="true">↗</span></button><button class="button button-outline" id="cancel-edit" type="button" hidden>Cancel edit</button></div><p class="form-message" id="product-message" role="alert"></p></form><div class="admin-table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Status</th><th></th></tr></thead><tbody id="product-list"></tbody></table></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script>
</body>
</html>
